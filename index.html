
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JerryJS v3 — API Timeline</title>
<style>
body {
  background: #10131b;
  color: #e8edf5;
  font-family: Arial, sans-serif;
  padding: 18px;
}
h1 { color: #63b3ff; }
.panel {
  background: #1c2330;
  padding: 14px;
  margin: 12px 0;
  border-radius: 9px;
}
button {
  padding: 10px 14px;
  background: #287bd1;
  color: white;
  border: 0;
  border-radius: 6px;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 12px;
}
</style>
</head>
<body>
<h1>JerryJS</h1>
<p>API Appearance Timeline v3</p>

<div class="panel">
  <h3>Timeline status</h3>
  <p id="status">Starting...</p>
  <p id="elapsed">Elapsed: 0 ms</p>
</div>

<div class="panel">
  <h3>Lifecycle events</h3>
  <pre id="events"></pre>
</div>

<div class="panel">
  <h3>API availability results</h3>
  <pre id="results">Collecting results...</pre>
</div>

<div class="panel">
  <button id="rerun">Run again</button>
  <button id="copy">Select results</button>
</div>

<script>
(function () {
  const start = performance.now();
  const status = document.getElementById("status");
  const elapsed = document.getElementById("elapsed");
  const eventsBox = document.getElementById("events");
  const resultsBox = document.getElementById("results");

  const events = [];
  const samples = [];
  const durationMs = 5000;
  const sampleIntervalMs = 100;

  let finished = false;
  let timerId = null;

  function timestamp() {
    return +(performance.now() - start).toFixed(2);
  }

  function recordEvent(name) {
    events.push({
      timeMs: timestamp(),
      event: name,
      readyState: document.readyState,
      visibility: document.visibilityState
    });
    render();
  }

  function detectAPIs() {
    return {
      fetch: typeof window.fetch === "function",
      websocket: typeof window.WebSocket === "function",
      localStorage: typeof window.localStorage !== "undefined",
      indexedDB: typeof window.indexedDB !== "undefined",
      webAssembly: typeof window.WebAssembly !== "undefined",
      webWorkers: typeof window.Worker === "function",
      serviceWorker: "serviceWorker" in navigator,
      broadcastChannel: typeof window.BroadcastChannel === "function",
      messageChannel: typeof window.MessageChannel === "function",
      crypto: typeof window.crypto !== "undefined",
      subtleCrypto: !!(window.crypto && window.crypto.subtle),
      performance: typeof window.performance !== "undefined",
      requestAnimationFrame:
        typeof window.requestAnimationFrame === "function",
      mutationObserver: typeof window.MutationObserver === "function",
      intersectionObserver:
        typeof window.IntersectionObserver === "function",
      geolocation: !!(navigator.geolocation),
      onlineStatus: typeof navigator.onLine === "boolean"
    };
  }

  function sample() {
    const state = detectAPIs();
    const time = timestamp();

    samples.push({ timeMs: time, state: state });
    elapsed.textContent = "Elapsed: " + time.toFixed(2) + " ms";

    if (time >= durationMs) {
      finish();
    } else {
      render();
    }
  }

  function render() {
    eventsBox.textContent = events.map(function (e) {
      return e.timeMs.toFixed(2) + " ms | " + e.event +
        " | readyState=" + e.readyState +
        " | visibility=" + e.visibility;
    }).join("\n");

    const names = Object.keys(detectAPIs());
    const lines = [];

    names.forEach(function (name) {
      const firstTrue = samples.find(function (s) {
        return s.state[name] === true;
      });
      const firstFalse = samples.find(function (s) {
        return s.state[name] === false;
      });

      let outcome;
      if (firstTrue && firstFalse) {
        outcome = "CHANGED DURING SAMPLING";
      } else if (firstTrue) {
        outcome = "Available at first observed sample (" +
          firstTrue.timeMs.toFixed(2) + " ms or earlier)";
      } else if (firstFalse) {
        outcome = "Unavailable throughout sampled period";
      } else {
        outcome = "Not tested";
      }

      lines.push(name + ": " + outcome);
    });

    resultsBox.textContent = lines.join("\n");
  }

  function finish() {
    if (finished) return;
    finished = true;
    if (timerId !== null) clearInterval(timerId);
    status.textContent = "Sampling complete (" +
      durationMs + " ms).";
    recordEvent("sampling-complete");
    render();
  }

  function begin() {
    if (timerId !== null) clearInterval(timerId);
    events.length = 0;
    samples.length = 0;
    finished = false;

    recordEvent("javascript-start");
    recordEvent("initial-document-state");

    sample();
    timerId = setInterval(sample, sampleIntervalMs);
  }

  document.addEventListener("readystatechange", function () {
    recordEvent("readystatechange");
  });
  document.addEventListener("DOMContentLoaded", function () {
    recordEvent("DOMContentLoaded");
  });
  window.addEventListener("load", function () {
    recordEvent("window-load");
  });
  window.addEventListener("pageshow", function () {
    recordEvent("pageshow");
  });
  window.addEventListener("focus", function () {
    recordEvent("focus");
  });
  window.addEventListener("blur", function () {
    recordEvent("blur");
  });
  document.addEventListener("visibilitychange", function () {
    recordEvent("visibilitychange");
  });
  window.addEventListener("online", function () {
    recordEvent("online");
  });
  window.addEventListener("offline", function () {
    recordEvent("offline");
  });

  document.getElementById("rerun").addEventListener("click", begin);
  document.getElementById("copy").addEventListener("click", function () {
    resultsBox.focus();
    const selection = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(resultsBox);
    selection.removeAllRanges();
    selection.addRange(range);
  });

  begin();
})();
</script>
</body>
</html>
