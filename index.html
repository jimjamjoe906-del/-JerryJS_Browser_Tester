
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JerryJS Universal API Tester</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    background: #10131b;
    color: #e9edf5;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 950px;
    margin: auto;
}

h1 { color: #66b5ff; }

.panel {
    background: #1b2230;
    border: 1px solid #344057;
    border-radius: 10px;
    padding: 16px;
    margin: 15px 0;
}

button {
    background: #267bd1;
    border: 0;
    color: white;
    padding: 12px 18px;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px;
}

button:hover { background: #3998ed; }

.result {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px;
    border-bottom: 1px solid #344057;
}

.status { font-weight: bold; }
.available { color: #58dc91; }
.unavailable { color: #ff7777; }
.unknown { color: #ffc66d; }

pre, textarea {
    width: 100%;
    background: #10131b;
    color: #b9d8ff;
    border: 1px solid #344057;
    border-radius: 6px;
    padding: 12px;
    overflow-wrap: anywhere;
}

textarea {
    min-height: 150px;
    resize: vertical;
}
</style>
</head>

<body>
<div class="container">

<h1>JerryJS Universal API Tester</h1>
<p>Cross-platform browser capability diagnostics</p>

<div class="panel">
    <h2>Device information</h2>
    <div id="device">Detecting device...</div>
</div>

<div class="panel">
    <h2>API diagnostics</h2>
    <p id="progress">Ready to test.</p>
    <button id="runButton" onclick="runTests()">Run API tests</button>
    <button onclick="exportResults()">Export JSON</button>
    <div id="results"></div>
</div>

<div class="panel">
    <h2>Detailed report</h2>
    <textarea id="report" readonly
        placeholder="Run diagnostics to generate a report."></textarea>
    <button onclick="copyReport()">Copy report</button>
</div>

</div>

<script>
(function () {
    "use strict";

    var results = [];
    var report = {};

    function safeCheck(fn) {
        try {
            return !!fn();
        } catch (e) {
            return false;
        }
    }

    function getPlatform() {
        var ua = navigator.userAgent || "";
        var platform = navigator.platform || "";

        if (/Nintendo Switch/i.test(ua)) return "Nintendo Switch";
        if (/PlayStation 5|PlayStation 5/i.test(ua)) return "PlayStation 5";
        if (/PlayStation 4|PlayStation 4/i.test(ua)) return "PlayStation 4";
        if (/Xbox/i.test(ua)) return "Xbox";
        if (/Android/i.test(ua)) return "Android";
        if (/iPhone|iPad|iPod/i.test(ua)) return "Apple mobile";
        if (/Windows/i.test(ua) || /Win/i.test(platform)) return "Windows";
        if (/Mac/i.test(ua) || /Mac/i.test(platform)) return "Mac";
        if (/Linux/i.test(ua)) return "Linux";

        return "Unknown platform";
    }

    function addResult(category, name, supported, details) {
        results.push({
            category: category,
            name: name,
            supported: supported,
            details: details || ""
        });
    }

    function testWebGL(version) {
        try {
            var canvas = document.createElement("canvas");
            var context = canvas.getContext(version);

            if (!context) return false;

            var info = context.getParameter(
                context.VERSION
            );

            return {
                supported: true,
                details: info || "Graphics context available"
            };
        } catch (e) {
            return false;
        }
    }

    function testIndexedDB() {
        return safeCheck(function () {
            return !!window.indexedDB;
        });
    }

    function testAPIs() {
        results = [];

        var checks = [
            ["JavaScript", "Promises", function () {
                return typeof window.Promise === "function";
            }],
            ["JavaScript", "Typed Arrays", function () {
                return typeof window.Uint8Array === "function";
            }],
            ["JavaScript", "BigInt", function () {
                return typeof window.BigInt === "function";
            }],
            ["JavaScript", "Async Functions", function () {
                return typeof window.Promise === "function";
            }],
            ["JavaScript", "Proxy", function () {
                return typeof window.Proxy === "function";
            }],
            ["JavaScript", "Reflect", function () {
                return typeof window.Reflect === "object";
            }],
            ["Runtime", "WebAssembly", function () {
                return typeof window.WebAssembly === "object";
            }],
            ["Runtime", "SharedArrayBuffer", function () {
                return typeof window.SharedArrayBuffer === "function";
            }],
            ["Runtime", "Atomics", function () {
                return typeof window.Atomics === "object";
            }],
            ["Graphics", "WebGL 1", function () {
                return !!testWebGL("webgl");
            }],
            ["Graphics", "WebGL 2", function () {
                return !!testWebGL("webgl2");
            }],
            ["Graphics", "WebGPU", function () {
                return !!(navigator.gpu);
            }],
            ["Storage", "IndexedDB", testIndexedDB],
            ["Storage", "Local Storage", function () {
                return !!window.localStorage;
            }],
            ["Storage", "Session Storage", function () {
                return !!window.sessionStorage;
            }],
            ["Network", "Fetch", function () {
                return typeof window.fetch === "function";
            }],
            ["Network", "XMLHttpRequest", function () {
                return typeof window.XMLHttpRequest === "function";
            }],
            ["Network", "WebSocket", function () {
                return typeof window.WebSocket === "function";
            }],
            ["Network", "WebRTC", function () {
                return typeof window.RTCPeerConnection === "function";
            }],
            ["Background", "Web Workers", function () {
                return typeof window.Worker === "function";
            }],
            ["Background", "Service Workers", function () {
                return !!(navigator.serviceWorker);
            }],
            ["Input", "Gamepad API", function () {
                return typeof navigator.getGamepads === "function";
            }],
            ["Input", "Pointer Events", function () {
                return typeof window.PointerEvent === "function";
            }],
            ["Input", "Touch Events", function () {
                return ("ontouchstart" in window);
            }],
            ["Media", "Web Audio", function () {
                return !!(window.AudioContext ||
                    window.webkitAudioContext);
            }],
            ["Media", "Media Devices", function () {
                return !!(navigator.mediaDevices);
            }],
            ["Browser", "Fullscreen API", function () {
                return !!(document.documentElement.requestFullscreen ||
                    document.documentElement.webkitRequestFullscreen);
            }],
            ["Browser", "Clipboard API", function () {
                return !!(navigator.clipboard);
            }],
            ["Browser", "TextEncoder", function () {
                return typeof window.TextEncoder === "function";
            }],
            ["Browser", "URL API", function () {
                return typeof window.URL === "function";
            }],
            ["Browser", "Readable Streams", function () {
                return typeof window.ReadableStream === "function";
            }],
            ["Security", "Subtle Crypto", function () {
                return !!(window.crypto && window.crypto.subtle);
            }],
            ["Security", "Secure Context", function () {
                return window.isSecureContext === true;
            }]
        ];

        for (var i = 0; i < checks.length; i++) {
            var item = checks[i];
            var supported = safeCheck(item[2]);

            addResult(
                item[0],
                item[1],
                supported,
                supported ? "Available" : "Unavailable"
            );
        }
    }

    function renderResults() {
        var output = document.getElementById("results");
        output.innerHTML = "";

        var available = 0;
        var unavailable = 0;

        for (var i = 0; i < results.length; i++) {
            var item = results[i];

            if (item.supported) {
                available++;
            } else {
                unavailable++;
            }

            var row = document.createElement("div");
            row.className = "result";

            var name = document.createElement("span");
            name.textContent = item.category + " / " + item.name;

            var status = document.createElement("span");
            status.className = "status " +
                (item.supported ? "available" : "unavailable");

            status.textContent = item.supported
                ? "AVAILABLE"
                : "UNAVAILABLE";

            row.appendChild(name);
            row.appendChild(status);
            output.appendChild(row);
        }

        document.getElementById("progress").textContent =
            "Completed: " + results.length +
            " tests | Available: " + available +
            " | Unavailable: " + unavailable;

        report = {
            project: "JerryJS",
            version: "1.0",
            platform: getPlatform(),
            userAgent: navigator.userAgent || "Unknown",
            language: navigator.language || "Unknown",
            timestamp: new Date().toISOString(),
            results: results
        };

        document.getElementById("report").value =
            JSON.stringify(report, null, 2);
    }

    window.runTests = function () {
        document.getElementById("runButton").disabled = true;

        try {
            testAPIs();
            renderResults();
        } catch (e) {
            document.getElementById("progress").textContent =
                "Diagnostics failed: " + e.message;
        }

        document.getElementById("runButton").disabled = false;
    };

    window.exportResults = function () {
        var data = JSON.stringify(report, null, 2);

        if (!report.results) {
            alert("Run the tests first.");
            return;
        }

        try {
            var blob = new Blob([data], {
                type: "application/json"
            });

            var url = URL.createObjectURL(blob);
            var link = document.createElement("a");

            link.href = url;
            link.download = "jerryjs-console-report.json";
            link.click();

            setTimeout(function () {
                URL.revokeObjectURL(url);
            }, 1000);
        } catch (e) {
            document.getElementById("report").value = data;
        }
    };

    window.copyReport = function () {
        var field = document.getElementById("report");

        field.focus();
        field.select();

        try {
            document.execCommand("copy");
        } catch (e) {
            alert("Select and copy the report manually.");
        }
    };

    document.getElementById("device").textContent =
        "Platform: " + getPlatform() +
        "\nBrowser: " + navigator.userAgent +
        "\nLanguage: " + navigator.language;

})();
</script>
</body>
</html>
